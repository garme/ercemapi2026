<style>

    .main-header {

    }

    .dropdown { position: relative; }
    .dropdown-content {

    }

    .dropdown-content a:hover {
        background-color: #0f3460;
        color: #e94560;
    }

    /* Menu Mobile */
    .menu-toggle {

        align-items: center;

        height: 46px;

        outline: none;
    }
    .menu-toggle .bar { width: 28px; height: 3px; background-color: #ffffff; border-radius: 2px; }

    @media (max-width: 950px) {

            padding: 0.6rem 4%;
            gap: 0.75rem;
        }

        .main-header .logo-container {
            flex: 1 1 auto;
            max-width: calc(100% - 64px);
        }

        .main-header .logo-container a {
            width: fit-content;
            max-width: min(100%, 320px);
            padding: 0 10px;
        }

        .main-header .logo-container img {
            max-height: 64px;
        }

        .menu-toggle { display: flex; }

        .main-header nav {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;

            color: #ffffff;
        }

        }
