<style>
    /* Estilos exclusivos do cabeçalho */
    .main-header {
        background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
        padding: 0.8rem 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        border-bottom: 3px solid #e94560;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .main-header .logo-container a {
        display: flex;
        align-items: center;
        background-color: #ffffff; 
        padding: 0px 15px;
        border-radius: 8px;
        text-decoration: none;
        transition: transform 0.3s ease;
    }
    .main-header .logo-container a:hover {
        transform: scale(1.05); 
    }
    .main-header .logo-container img {
        max-height: 100px;
        width: auto;
        object-fit: contain;
    }

    /* Menu Padrão (Computador) */
    .main-header nav ul {
        list-style: none;
        display: flex;
        gap: 2rem;
        margin: 0;
        padding: 0;
        align-items: center;
    }
    .main-header nav a {
        color: #f5f5f5;
        text-decoration: none;
        font-weight: 500;
        font-size: 1.1rem;
        transition: color 0.3s ease;
        position: relative;
        padding: 0.5rem 0;
        cursor: pointer;
    }
    
    .main-header nav a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: #e94560;
        transition: width 0.3s ease;
    }
    .main-header nav a:hover::after, 
    .main-header nav a.active::after {
        width: 100%;
    }
    .main-header nav a:hover, 
    .main-header nav a.active {
        color: #e94560;
    }

    /* Dropdown Geral */
    .dropdown {
        position: relative;
        display: inline-block;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #16213e;
        min-width: 220px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
        z-index: 1001;
        border-radius: 4px;
        border-top: 3px solid #e94560;
        top: 100%;
        left: 0;
    }
    .dropdown-content a {
        color: #f5f5f5;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        font-size: 1rem;
        transition: background 0.3s;
    }
    .dropdown-content a::after {
        display: none; 
    }
    .dropdown-content a:hover {
        background-color: #0f3460;
        color: #e94560;
    }
    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* Botão Hambúrguer (Escondido no PC) */
    .menu-toggle {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 6px;
    }
    .menu-toggle .bar {
        width: 30px;
        height: 3px;
        background-color: #f5f5f5;
        border-radius: 2px;
        transition: 0.3s;
    }

    /* ====== RESPONSIVIDADE (Telemóveis e Tablets) ====== */
    @media (max-width: 950px) {
        .menu-toggle {
            display: flex; /* Mostra o botão hambúrguer */
        }
        
        .main-header nav {
            display: none; /* Esconde o menu por padrão no mobile */
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 3px solid #e94560;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
        }
        
        /* Classe que o JavaScript vai ativar para mostrar o menu */
        .main-header nav.active {
            display: block;
        }

        .main-header nav ul {
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            padding: 1rem 5%;
        }

        .main-header nav a {
            width: 100%;
            display: block;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Ajustes do Dropdown para Mobile */
        .dropdown {
            width: 100%;
        }
        .dropdown-content {
            position: static; /* Faz os submenus empurrarem o conteúdo para baixo */
            box-shadow: none;
            background-color: rgba(0, 0, 0, 0.2); /* Fundo mais escuro para diferenciar */
            border-top: none;
            padding-left: 1.5rem; /* Indentação */
        }
        
        /* Diminui a logo ligeiramente em ecrãs muito pequenos */
        .main-header .logo-container img {
            max-height: 70px;
        }
    }
</style>
