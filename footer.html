<style>
    /* Estilos exclusivos do rodapé */
    .main-footer {
        background-color: #1a1a2e;
        color: #f5f5f5;
        text-align: center;
        padding: 3rem 5%;
        margin-top: 4rem;
        border-top: 3px solid #e94560;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .main-footer p {
        margin-bottom: 1rem;
        font-size: 1.05rem;
    }
    
    /* Layout para os logótipos */
    .footer-logos-container {
        background-color: #ffffff;
        padding: 2.5rem 2rem;
        border-radius: 8px;
        max-width: 850px;
        margin: 2rem auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        gap: 3rem; /* Espaço vertical padrão entre as linhas */
    }
    
    .logos-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 6rem; /* Espaço horizontal padrão entre os grupos */
    }

    .logo-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }
    
    .logo-group h4 {
        color: #1a1a2e;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0;
        border-bottom: 2px solid #e94560;
        padding-bottom: 0.5rem;
    }
    
    .logo-items {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2.5rem; 
    }
    
    /* Controle de tamanho das imagens no Desktop */
    .logo-items img {
        max-height: 70px;
        max-width: 100%; /* Impede que a imagem ultrapasse o tamanho da tela */
        width: auto;
        object-fit: contain;
        transition: transform 0.3s ease;
    }
    
    .logo-items img:hover {
        transform: scale(1.05);
    }

    .main-footer .contato {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #aaa;
    }
    .main-footer .contato a {
        color: #e94560;
        text-decoration: none;
        font-weight: bold;
    }
    .main-footer .contato a:hover {
        text-decoration: underline;
    }

    /* ====== REGRA DE RESPONSIVIDADE (Telas até 768px - Mobile) ====== */
    @media (max-width: 768px) {
        .main-footer {
            padding: 2rem 5%; /* Reduz o espaçamento do rodapé geral */
        }
        
        .main-footer p {
            font-size: 0.95rem; /* Diminui levemente o texto do copyright */
        }

        .footer-logos-container {
            padding: 1.5rem 1rem; /* Reduz o espaço branco interno no mobile */
            gap: 2rem; /* Diminui a distância vertical entre as duas linhas originais */
            margin: 1.5rem auto;
        }
        
        .logos-row {
            flex-direction: column; /* Transforma as linhas horizontais em blocos verticais */
            align-items: center;
            gap: 2rem; /* Reduz o espaçamento entre grupos de logos */
        }
        
        .logo-group {
            gap: 1rem;
            width: 100%;
        }

        .logo-items {
            flex-wrap: wrap; /* Permite que os logos quebrem linha em celulares muito estreitos */
            gap: 1.5rem; /* Reduz o espaço entre logos vizinhos (ex: IFCE e UFC) */
        }
        
        .logo-items img {
            max-height: 55px; /* Diminui o tamanho máximo das imagens para harmonizar no mobile */
        }
    }
</style>

<footer class="main-footer">
    <p>© 2026 XIV ERCEMAPI - As IAs Generativas: Redefinindo as Fronteiras entre a Computação e a Sociedade</p>
    
    <div class="footer-logos-container">
        <div class="logos-row">
            <div class="logo-group">
                <h4>Realização</h4>
                <div class="logo-items">
                    <img src="img/sbc.png" alt="SBC - Sociedade Brasileira de Computação" title="SBC">
                </div>
            </div>
            
            <div class="logo-group">
                <h4>Organização</h4>
                <div class="logo-items">
                    <img src="img/ifce.png" alt="Instituto Federal do Ceará" title="IFCE">
                    <img src="img/ufc.png" alt="Universidade Federal do Ceará" title="UFC">
                </div>
            </div>
        </div>
        
        <div class="logos-row">
            <div class="logo-group">
                <h4>Apoio</h4>
                <div class="logo-items">
                    <img src="img/funcap.jpg" alt="FUNCAP" title="FUNCAP">
                </div>
            </div>
        </div>
    </div>

    <p class="contato">Dúvidas ou Informações? <a href="mailto:ercemapi2026@gmail.com">ercemapi@crato.ifce.edu.br</a></p>
</footer>
